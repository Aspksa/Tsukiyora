name: Tsukiyora runtime checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/soul-core-runtime, feat/long-term-memory, feat/cloudru-chat, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: python -m compileall -q launcher.py memory_store.py cloudru.py tests
      - name: Check browser JS syntax
        run: |
          python -c "from pathlib import Path; Path('ui/app.check.mjs').write_bytes(Path('ui/app.ts').read_bytes())"
          node --check ui/app.check.mjs
      - name: Validate JSON personality
        run: python -m json.tool soul/personality.json
      - name: Run tests
        run: python -m unittest discover -s tests -v
