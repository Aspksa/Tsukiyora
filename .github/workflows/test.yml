name: Tsukiyora runtime checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/soul-core-runtime, feat/long-term-memory, feat/cloudru-chat, feat/living-memory-v2, feat/tsukiyora-cognitive-v05, feat/tsukiyora-v06-intelligence, feat/tsukiyora-v07-reliability, feat/tsukiyora-v08-intelligence, feat/tsukiyora-v09-stability, feat/tsukiyora-v10-release, feat/tsukiyora-v11-integrated, feat/tsukiyora-v11-intelligence, feat/tsukiyora-v12-knowledge, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: python -m compileall -q launcher.py memory_store.py cloudru.py soul_growth.py stream_runtime.py vector_memory.py cognitive_core.py memory_quality.py experience_engine.py layered_memory.py reliability.py maintenance.py reasoning.py restore_memory.py precision_memory.py soul_academy.py persona_continuity.py brain_atlas.py rag_pipeline.py academy_metrics.py migration_guard.py rag_fusion.py resource_guard.py academy_experiments.py local_documents.py evidence_review.py academy_curriculum.py persona_arc.py document_parser.py contract_insights.py atlas_materializer.py academy_rollback.py academy_practice.py conversation_memory.py semantic_groups.py tests scripts
      - name: Check browser JS syntax
        run: |
          python -c "from pathlib import Path; Path('ui/app.check.mjs').write_bytes(Path('ui/app.ts').read_bytes())"
          node --check ui/app.check.mjs
      - name: Check progressive atlas module syntax
        run: |
          python -c "from pathlib import Path; Path('ui/atlas_view.check.mjs').write_bytes(Path('ui/atlas_view.ts').read_bytes())"
          node --check ui/atlas_view.check.mjs
      - name: Verify Windows BAT launch in isolated smoke mode
        if: runner.os == 'Windows'
        shell: cmd
        run: call Tsukiyora.bat --self-test
      - name: Validate JSON personality
        run: python -m json.tool soul/personality.json
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Million-record SQLite atlas scale check
        timeout-minutes: 12
        run: python scripts/test_million_atlas.py
